name: CI

# 对标 riverqueue/river（6 条 workflow）、hibiken/asynq（2 条）的 CI 保护面：
# 本项目是 Windows 单 EXE 桌面程序，故矩阵只跑 windows-latest，但判据与同类项目对齐：
#   1) go vet        —— 静态检查（等价于对方 lint 步骤）
#   2) go test -race —— 竞态检测（需要 mingw gcc；windows-latest 镜像自带）
#   3) build.ps1     —— 完整构建 + 覆盖率门禁（自带阈值，低于阈值直接失败）
#   4) 产物校验      —— EXE 存在、大小在合理区间、--version / --diagnose 可执行

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: vet + test (race)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: workbench/go.mod

      - name: Repo hygiene gates (CHANGELOG / issue templates)
        shell: pwsh
        # 本 job 的 defaults 把 cwd 设成了 workbench/，而仓库级判据在仓根 ——
        # 必须显式覆写，否则 ./tests/... 会解析成 workbench/tests/... 而找不到文件。
        working-directory: .
        run: |
          # 与代码判据同批跑：文档/模板类回归同样是回归，不该只在人眼评审里。
          ./tests/check_changelog.ps1
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG 结构门禁未通过" }
          # 无人值守静态门禁：仓库内脚本不得留下会等人工按键的构造
          # （实测事故：keepalive 计划任务里一条缺 -UseBasicParsing 的
          #  Invoke-WebRequest 触发 PS5.1 IE 引擎安全警告，桌面弹窗且任务永久挂起）
          ./tests/check_noninteractive.ps1
          if ($LASTEXITCODE -ne 0) { throw "无人值守静态门禁未通过" }
          # Issue Forms 结构门禁：查顶层 name/description/body、每块 attributes.label、
          # dropdown/checkboxes 的 options 必须位于 attributes 之内、contact_links 必须用 about。
          # 原先只查顶层三键的弱判据放得过真实缺陷：options 位置写错时 GitHub 会
          # 静默少渲染该字段（页面看着正常，实际问不到关键信息）。已用变异测试验证新判据。
          ./tests/check_issue_forms.ps1
          if ($LASTEXITCODE -ne 0) { throw "Issue Forms 结构门禁未通过" }


  repo-gates:
    name: repo gates (script-level)
    runs-on: windows-latest
    # 为什么单开一个 job（2026-10-22）：本仓 tests/ 下有 23 个受跟踪门禁脚本，
    # 而 CI 此前只执行其中 4 个 —— 其余（含 check_gofmt / check_gate_links /
    # check_tray_window / check_spawn_silent / check_snapshot_build）**从未被任何自动化执行**。
    # 「判据存在但没挂受理面」是本仓在册失效形态，故把它们真正挂进来，且单列一个 job：
    # 与 vet/test 分开，失败可归因到具体门禁，不会淹在 30 万行测试输出里。
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: workbench/go.mod

      - name: Run repo gates (each judged independently)
        shell: pwsh
        # 反掩盖：逐个跑、逐个判、任一 rc!=0 即整体失败；不允许聚合洗绿。
        # 每个脚本前打印分隔行，便于在 CI 日志里定位是哪条判据红了。
        run: |
          $gates = @(
            'tests/check_changelog.ps1',
            'tests/check_issue_forms.ps1',
            'tests/check_noninteractive.ps1',
            'tests/check_gate_links.ps1',
            'tests/check_gofmt.ps1',
            'tests/check_tray_window.ps1',
            'tests/check_spawn_silent.ps1',
            'tests/check_snapshot_build.ps1'
          )
          $failed = @()
          foreach ($g in $gates) {
            Write-Host ("")
            Write-Host ("===== GATE: " + $g) -ForegroundColor Cyan
            & powershell -NoProfile -ExecutionPolicy Bypass -File $g
            $rc = $LASTEXITCODE
            if ($rc -ne 0) {
              Write-Host ("GATE FAILED (rc=" + $rc + "): " + $g) -ForegroundColor Red
              $failed += ($g + " (rc=" + $rc + ")")
            } else {
              Write-Host ("GATE PASS: " + $g) -ForegroundColor Green
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host ("")
            Write-Host ("仓库门禁失败 " + $failed.Count + " 项：") -ForegroundColor Red
            $failed | ForEach-Object { Write-Host ("  - " + $_) -ForegroundColor Red }
            throw ("repo gates failed: " + ($failed -join '; '))
          }
          Write-Host ("")
          Write-Host ("全部仓库门禁通过（" + $gates.Count + " 项）") -ForegroundColor Green

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

  build:
    name: build + coverage gate
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: workbench/go.mod

      - name: Build single EXE (含覆盖率门禁)
        shell: pwsh
        run: ./setup/build.ps1 -Version 1.1.0

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "dist/workbench.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }
          $size = (Get-Item $exe).Length
          # 体积上界改为引用基线口径（docs/benchmark/perf-baseline.json 的 exeMaxBytes），不再硬编码 40MB。
          # 基线读不到时**退回原硬编码 40MB 并告警**：本步骤不把「没读到基线」当成产物不合格 ——
          # 那种情形由下一步 "Perf baseline gate" 判 rc=2 UNVERIFIED，三态各归各位（口径见 docs/benchmark/性能基线口径.md）。
          $maxBytes = 40MB
          $minBytes = 3MB
          $bl = "docs/benchmark/perf-baseline.json"
          if (Test-Path $bl) {
            try {
              $blObj = [IO.File]::ReadAllText($bl) | ConvertFrom-Json
              $v = $blObj.exeMaxBytes
              if ($v -and $v -gt 0) { $maxBytes = [long]$v } else { Write-Warning "基线 exeMaxBytes 为 null/非法，退回 40MB（体积上界未被基线约束）" }
              $mv = $blObj.exeMinBytes
              if ($mv -and $mv -gt 0) { $minBytes = [long]$mv } else { Write-Warning "基线 exeMinBytes 为 null/非法，退回 3MB（体积下界未被基线约束）" }
            } catch { Write-Warning "基线解析失败，退回 40MB/3MB: $($_.Exception.Message)" }
          } else { Write-Warning "缺 docs/benchmark/perf-baseline.json，退回 40MB/3MB" }
          $maxMB = [math]::Round($maxBytes / 1MB, 2)
          $minMB = [math]::Round($minBytes / 1MB, 2)
          if ($size -lt $minBytes -or $size -gt $maxBytes) { throw "产物大小异常: $size bytes（区间 $minMB..$maxMB MB，双向界均取自 perf-baseline.json）" }
          # SHA256SUMS 读回校验（issue #8 判据 2 后半）：build.ps1 5/6 段尾自动重写清单，
          # 本步独立读回比对 —— 防清单与产物漂移（2026-10-20 实发：产物重建后清单还是旧 hash，
          # 当时所有以清单为凭的验收证据全部失效）。不一致判红，不允许跳过。
          $sums = "dist/SHA256SUMS"
          if (-not (Test-Path $sums)) { throw "缺 dist/SHA256SUMS：build.ps1 未产出校验清单（不应出现——构建链已含重写段）" }
          $listed = (Get-Content $sums | Where-Object { $_ -match "workbench\.exe" } | Select-Object -First 1)
          if (-not $listed) { throw "dist/SHA256SUMS 无 workbench.exe 条目" }
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          $listedHash = ($listed -split "\s+")[0]
          if ($listedHash -ne $actual) { throw "SHA256SUMS 漂移: 清单 $listedHash != 实测 $actual（产物与清单不一致，issue #8 判据）" }
          Write-Host "SHA256SUMS 校验通过: $actual"
          # EXE 是 GUI 子系统（-H=windowsgui）：CI 无控制台会话时 stdout 捕获可能为空或退出码非零，
          # 本机有控制台则正常。--version 作为「能跑起来」探针，输出经 Out-String 兜底；
          # 退出码非零仅告警（GUI 程序在 headless CI 的常见行为），存在性/大小/版本/SHA256 由 build.ps1 6/6 段已硬校验。
          $ver = ""
          try { $ver = (& $exe --version 2>&1 | Out-String).Trim() } catch { $ver = "(输出捕获失败)" }
          if ($ver -and $ver -notmatch "workbench") { Write-Warning "--version 输出异常: $ver" }
          Write-Host "产物校验通过: $size bytes; --version: $ver"

      - name: Perf baseline gate
        shell: pwsh
        # 对标 temporal/river 的 bench/产物断言进 CI：把 docs/benchmark/WorkBench-开源对标报告.md §3.5
        # 那批「手工单次读数」变成有数据件、有判据、有退出码的护栏（知识盲区 B8 / 学习计划 L8）。
        # 判据源 = docs/benchmark/perf-baseline.json；口径、取证命令、上界推导见 docs/benchmark/性能基线口径.md。
        # 三态（tests/check_perf.ps1 的约定，与 check_subsystem / check_no_shrink 同风格）：
        #   0=PASS / 1=FAIL（超出基线上界）/ 2=UNVERIFIED（产物或基线缺失、解析失败、一项判定都没做成）。
        # rc=2 在这里**判红**：基线文件是本仓受控数据件，CI 里取不到就是「护栏静默失效」——
        # 与 setup/build.ps1 对子系统校验器「不在就内联自证，而不是跳过」同一立场。
        # 本步骤默认只判体积上界；运行期读数（首页 P95/常驻内存/句柄）因基线是本机取证而显式 SKIP，
        # 不在 runner 上冒充判定（避免误报把整个护栏的信任打掉）。
        run: |
          ./tests/check_perf.ps1 -Exe dist/workbench.exe
          $perfRc = $LASTEXITCODE
          # verdict + 读数落盘成时间序列（issue #8 判据 4）：单次 verdict 只有「过/不过」，
          # 看不见「每次涨 5% 缓慢贴边」。落盘件由下步 upload 成 artifact，跨 run 可比。
          $blObj2 = [IO.File]::ReadAllText("docs/benchmark/perf-baseline.json") | ConvertFrom-Json
          $exeItem = Get-Item dist/workbench.exe
          $row = [pscustomobject]@{
            ts = (Get-Date).ToString("o")
            sha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            verdict = $(if ($perfRc -eq 0) { "PASS" } elseif ($perfRc -eq 1) { "FAIL" } else { "UNVERIFIED" })
            rc = $perfRc
            exeBytes = $exeItem.Length
            exeMinBytes = $blObj2.exeMinBytes
            exeMaxBytes = $blObj2.exeMaxBytes
          }
          New-Item -ItemType Directory -Force -Path perf-trend | Out-Null
          $row | ConvertTo-Json -Compress | Add-Content -Path perf-trend/perf-verdict.jsonl -Encoding UTF8
          Write-Host "趋势读数已落盘: perf-trend/perf-verdict.jsonl => $($row | ConvertTo-Json -Compress)"
          if ($perfRc -eq 1) { throw "性能基线门禁未通过：产物超出 perf-baseline.json 的双向界（见上方 CHECK 行）" }
          if ($perfRc -ne 0) { throw "性能基线无法判定（UNVERIFIED rc=$perfRc）：产物或基线数据件缺失/解析失败 —— 护栏没跑成，不等于性能合格" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: workbench-exe
          path: dist/workbench.exe
          retention-days: 7

      # 性能趋势时间序列（issue #8 判据 4）：每次 CI 的 verdict + 体积读数 upload 成 artifact。
      # 命名含 run_id 保证每次 run 独立成件（同名会覆盖，时间序列就断了）；
      # retention 90 天跨 run 拼出趋势——上界拦「翻倍」，趋势拦「每次涨 5% 缓慢贴边」。
      - name: Upload perf trend
        uses: actions/upload-artifact@v4
        with:
          name: perf-trend-${{ github.run_id }}
          path: perf-trend/perf-verdict.jsonl
          retention-days: 90
          if-no-files-found: error
