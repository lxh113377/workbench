name: Autonomy Container E2E

# 自主闭环的容器端到端验收（Linux VM 模拟，确定性通道）。
#
# 为什么单独一条 workflow：
#   主 ci.yml 跑 windows-latest 的 vet/test/build；本工作流跑 **Linux 容器内** 的
#   自主闭环终点断言（目标完成 → 自动推导下一目标），它不依赖外部模型通道，
#   因此可以在 CI 上稳定复现（宿主通道受出口 IP 影响会 429/401）。
#
# 与主 ci.yml 的关系：**新增，不修改**。两者职责不重叠：
#   ci.yml            —— 源码质量（vet / race / 覆盖率门禁 / 产物校验）
#   本工作流           —— 运行时行为（自主闭环是否真能跑到 goalDone/nextGoal）
#
# 触发：与主 ci 同步（push/PR/dispatch），另可手工触发。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-e2e:
    name: autonomy closed-loop (container)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: workbench/go.mod

      - name: Cross-build static Linux binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci -X main.buildTime=ci" \
            -o ../dist/workbench-linux-amd64 ./cmd/workbench

      - name: Build deterministic DSH stub
        working-directory: tests/docker-autonomy/fakedsh
        run: |
          CGO_ENABLED=0 go build -trimpath -o ../../../dist/fakedsh .

      - name: Criteria coverage (声明 vs 实现交叉校验)
        working-directory: .
        run: bash tests/docker-autonomy/criteria-coverage.sh workbench

      - name: Enum consistency scan (分发器 vs 成员覆盖)
        working-directory: .
        run: bash tests/docker-autonomy/consistency-scan.sh workbench

      - name: Static linkage self-check (no PT_INTERP)
        working-directory: dist
        run: |
          cat > /tmp/checkstatic.go <<'EOF'
          package main
          import ("debug/elf"; "fmt"; "os")
          func main() {
            f, err := elf.Open(os.Args[1])
            if err != nil { fmt.Println("ELF_OPEN_FAIL:", err); os.Exit(2) }
            defer f.Close()
            for _, pr := range f.Progs { if pr.Type == elf.PT_INTERP { fmt.Println("STATIC_FAIL"); os.Exit(2) } }
            fmt.Println("STATIC_OK")
          }
          EOF
          go run /tmp/checkstatic.go workbench-linux-amd64

      - name: Binary capability smoke (flag surface)
        working-directory: .
        env:
          B: ./dist/workbench-linux-amd64
        run: bash tests/docker-autonomy/capability-smoke.sh "$B"

      - name: Autonomy closed-loop E2E in container
        working-directory: .            # 仓库根：路径都用 dist/ 与 tests/ 相对根算
        run: |
          docker run --rm --name fenjue-autonomy-ci \
            -v "$PWD/dist/workbench-linux-amd64:/test/wb:ro" \
            -v "$PWD/dist/fakedsh:/test/fakedsh:ro" \
            -v "$PWD/tests/docker-autonomy:/dk" \
            -e RUN_ID=ci \
            debian:bookworm-slim bash -lc "apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq python3 >/dev/null 2>&1 && bash /dk/container.sh"

      - name: Upload evidence
        if: always()                     # uses 步骤不接受 working-directory，path 直接写仓库根相对路径
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-e2e-evidence
          path: tests/docker-autonomy/evidence/ci
          retention-days: 14
